name: Mirror Chart
run-name: Mirror Chart ${{ inputs.from }} -> ${{ inputs.to }}

on:
  workflow_dispatch:
    inputs:
      from:
        type: string
        description: OCI chart to mirror (e.g. registry-1.docker.io/bitnamicharts/postgresql:18.11.3)
        required: true
      
      to:
        type: string
        description: Name and tag of the mirrored chart in this repo. This can include namespace components too. (e.g. namespace/nested/postgres:18.11.3)
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Install oras
        uses: oras-project/setup-oras@v1
        
      - name: Mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fromImage: ${{ inputs.from }}
          toImage: ${{ inputs.to }}
        run: |-
          oras login ghcr.io --username ${{ github.actor }} --password-stdin
          oras cp -r "$fromImage" "$toImage"
